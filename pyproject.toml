[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "behavioral-data-toolkit"
dynamic = ["version"]
description = "A reproducible Python toolkit for behavioral research: data validation, questionnaire scoring, descriptive statistics, correlation and reporting."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Mohamad Iksan Ubaidillah" }]
keywords = [
    "behavioral science",
    "psychology",
    "psychometrics",
    "research software",
    "reproducibility",
    "cronbach alpha",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.8"]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "matplotlib>=3.8",
    "ruff>=0.5",
    "mypy>=1.10",
    "build>=1.2",
]

[project.urls]
Homepage = "https://github.com/meworo/open-behavioral-data-toolkit"
Issues = "https://github.com/meworo/open-behavioral-data-toolkit/issues"
Changelog = "https://github.com/meworo/open-behavioral-data-toolkit/blob/main/CHANGELOG.md"

[tool.setuptools.dynamic]
version = { attr = "behavioral_data_toolkit._version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
behavioral_data_toolkit = ["py.typed"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = ["error::DeprecationWarning:behavioral_data_toolkit"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "examples"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N"]

[tool.mypy]
strict = true
packages = ["behavioral_data_toolkit"]
mypy_path = "src"
ignore_missing_imports = true
